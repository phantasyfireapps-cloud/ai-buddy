name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Integration tests (auth, profiles, RLS)
        run: |
          export SUPABASE_TEST_URL=http://127.0.0.1:54321
          export SUPABASE_TEST_ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')
          pnpm test:integration
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: API tests
        working-directory: services/api
        run: |
          pip install -r requirements-dev.txt
          pytest -q

  windows-build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build installer
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'http://127.0.0.1:54321' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'missing-configure-repository-variable' }}
        run: pnpm --filter ai-buddy-desktop tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: ai-buddy-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
